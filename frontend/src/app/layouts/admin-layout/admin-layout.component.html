<div class="admin-shell">
  <aside class="admin-sidebar" [ngClass]="{ open: isMenuOpen }">
    <div class="admin-brand">
      <img src="https://i.imgur.com/RARaC9j.png" alt="Logo REASONS Research Hub" />
      <div>
        <strong>Admin REASONS</strong>
        <span>Gestion central</span>
      </div>
    </div>
    <nav class="admin-nav">
      <a routerLink="dashboard" routerLinkActive="active" (click)="closeMenu()">Dashboard</a>
      <button class="nav-item disabled" type="button">Configuracion</button>
      <button class="nav-item disabled" type="button">Investigadores</button>
      <button class="nav-item disabled" type="button">Proyectos</button>
      <button class="nav-item disabled" type="button">Publicaciones</button>
      <button class="nav-item disabled" type="button">Noticias</button>
      <button class="nav-item disabled" type="button">Ajustes del sitio</button>
    </nav>
    <button class="research-cta" type="button">Iniciar investigacion</button>
    <a class="admin-logout" routerLink="/admin/login">Cerrar sesion</a>
  </aside>

  <div class="admin-content">
    <header class="admin-topbar">
      <button class="admin-menu" type="button" aria-label="Abrir menu" (click)="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <label class="admin-search">
        <span class="sr-only">Buscar</span>
        <input type="search" placeholder="Buscar proyectos, investigadores..." />
      </label>
      <div class="admin-title">
        <strong>Panel de administracion</strong>
        <span>Universidad Tecnica de Ambato</span>
      </div>
      <div class="topbar-actions">
        <app-theme-toggle></app-theme-toggle>
        <span class="admin-profile">AR</span>
      </div>
    </header>

    <main class="admin-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

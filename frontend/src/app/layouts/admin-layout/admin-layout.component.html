<div class="admin-shell">
  <aside class="admin-sidebar" [ngClass]="{ open: isMenuOpen }">
    <div class="admin-brand">
      <img src="https://i.imgur.com/RARaC9j.png" alt="Logo REASONS Research Hub" />
      <div>
        <strong>{{ organizationName }}</strong>
        <span>{{ roleLabel }}</span>
      </div>
    </div>
    <nav class="admin-nav">
      <a routerLink="dashboard" routerLinkActive="active" (click)="closeMenu()">Dashboard</a>
      <a routerLink="settings" routerLinkActive="active" (click)="closeMenu()">Configuracion</a>
      <a routerLink="home" routerLinkActive="active" (click)="closeMenu()">Home</a>
      <a routerLink="about" routerLinkActive="active" (click)="closeMenu()">Nosotros</a>
      <a routerLink="research-lines" routerLinkActive="active" (click)="closeMenu()">Lineas</a>
      <a routerLink="researchers" routerLinkActive="active" (click)="closeMenu()">Investigadores</a>
      <a routerLink="projects" routerLinkActive="active" (click)="closeMenu()">Proyectos</a>
      <a routerLink="authors" routerLinkActive="active" (click)="closeMenu()">Autores</a>
      <a routerLink="publications" routerLinkActive="active" (click)="closeMenu()">Publicaciones</a>
      <a routerLink="news" routerLinkActive="active" (click)="closeMenu()">Noticias</a>
      <a routerLink="contact" routerLinkActive="active" (click)="closeMenu()">Contacto</a>
      <a routerLink="media" routerLinkActive="active" (click)="closeMenu()">Medios</a>
      <a routerLink="profile" routerLinkActive="active" (click)="closeMenu()">Perfil</a>
    </nav>
    <a class="research-cta" routerLink="projects">Iniciar investigacion</a>
    <button class="admin-logout" type="button" (click)="logout()">
      {{ isLoggingOut ? 'Cerrando...' : 'Cerrar sesion' }}
    </button>
  </aside>

  <div class="admin-content">
    <header class="admin-topbar">
      <button class="admin-menu" type="button" aria-label="Abrir menu" (click)="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <label class="admin-search">
        <span class="sr-only">Buscar</span>
        <input type="search" placeholder="Buscar proyectos, investigadores..." />
      </label>
      <div class="admin-title">
        <strong>Panel de administracion</strong>
        <span>{{ organizationName }}</span>
      </div>
      <div class="topbar-actions">
        <app-theme-toggle></app-theme-toggle>
        <span class="admin-profile">{{ initials }}</span>
      </div>
    </header>

    <main class="admin-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

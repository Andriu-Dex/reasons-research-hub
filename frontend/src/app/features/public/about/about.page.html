<section class="container page">
  <h1 class="section-title">Nosotros</h1>
  @if (about(); as data) {
    <p class="lead">{{ data.description }}</p>
    <article class="card objective">
      <h2>Objetivo general</h2>
      <p>{{ data.generalObjective }}</p>
    </article>
    <div class="objectives">
      @for (objective of data.objectives; track objective.id) {
        <article class="card">{{ objective.description }}</article>
      }
    </div>
  }
</section>

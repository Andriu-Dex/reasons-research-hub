<section class="container page">
  <h1 class="section-title">Noticias</h1>
  <div class="news-list">
    @for (item of news(); track item.id) {
      <article class="card news-card">
        <time>{{ item.publishedAt | date: 'dd/MM/yyyy' }}</time>
        <h2>{{ item.title }}</h2>
        <p>{{ item.summary }}</p>
      </article>
    }
  </div>
</section>

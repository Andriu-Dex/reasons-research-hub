<section class="container page">
  <h1 class="section-title">Investigadores</h1>
  <div class="grid">
    @for (researcher of researchers(); track researcher.id) {
      <article class="card researcher">
        <div class="avatar">{{ researcher.fullName.slice(0, 1) }}</div>
        <h2>{{ researcher.fullName }}</h2>
        <strong>{{ researcher.position }}</strong>
        <p>{{ researcher.biography }}</p>
        <a [href]="'mailto:' + researcher.institutionalEmail">
          <lucide-icon [img]="mailIcon" [size]="16" />
          {{ researcher.institutionalEmail }}
        </a>
      </article>
    }
  </div>
</section>

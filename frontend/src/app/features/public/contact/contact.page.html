<section class="container page">
  <div>
    <h1 class="section-title">Contacto</h1>
    <p>Envia un mensaje al equipo administrativo del grupo de investigacion.</p>
  </div>
  <form class="card form-grid" [formGroup]="form" (ngSubmit)="submit()">
    <label class="field">
      <span>Nombre</span>
      <input formControlName="name" type="text">
    </label>
    <label class="field">
      <span>Correo electronico</span>
      <input formControlName="email" type="email">
    </label>
    <label class="field">
      <span>Asunto</span>
      <input formControlName="subject" type="text">
    </label>
    <label class="field">
      <span>Mensaje</span>
      <textarea formControlName="message"></textarea>
    </label>
    <button class="button" type="submit">
      <lucide-icon [img]="sendIcon" [size]="18" />
      Enviar mensaje
    </button>
  </form>
</section>

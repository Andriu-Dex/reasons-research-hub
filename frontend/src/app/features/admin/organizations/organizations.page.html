<main class="organizations">
  <section>
    <h1>Organizaciones</h1>
    <p>Gestion global disponible solo para superadministradores.</p>
    <div class="grid">
      @for (organization of organizations(); track organization.id) {
        <article class="card">
          <h2>{{ organization.name }}</h2>
          <span>{{ organization.slug }}</span>
        </article>
      }
    </div>
  </section>
  <aside class="card">
    <h2>Nueva organizacion</h2>
    <textarea [(ngModel)]="editorValue"></textarea>
    <button class="button" type="button" (click)="create()">Crear</button>
  </aside>
</main>

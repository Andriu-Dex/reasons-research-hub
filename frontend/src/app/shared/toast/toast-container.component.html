<div class="toast-stack" aria-live="polite" aria-atomic="true">
  <div class="toast" *ngFor="let toast of toasts(); trackBy: trackToast" [ngClass]="toast.variant">
    <div class="toast-icon" [ngSwitch]="toast.variant">
      <svg *ngSwitchCase="'success'" class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M9.2 16.2 5.7 12.7l1.4-1.4 2.1 2.1 7.8-7.8 1.4 1.4z" />
      </svg>
      <svg *ngSwitchCase="'error'" class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M12 2 1 21h22zM12 8v6h-2V8zm0 8v2h-2v-2z" />
      </svg>
      <svg *ngSwitchCase="'warning'" class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M12 2 1 21h22zM12 7v7h-2V7zm0 9v2h-2v-2z" />
      </svg>
      <svg *ngSwitchDefault class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.4 0-8-3.6-8-8s3.6-8 8-8 8 3.6 8 8-3.6 8-8 8z" />
      </svg>
    </div>
    <div class="toast-body">
      <p class="toast-title">{{ toast.title }}</p>
      <p class="toast-message" *ngIf="toast.message">{{ toast.message }}</p>
    </div>
    <button class="toast-close" type="button" (click)="dismiss(toast.id)" aria-label="Cerrar notificacion">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="m6.4 5 12.6 12.6-1.4 1.4L5 6.4z" />
        <path fill="currentColor" d="m19 6.4-12.6 12.6-1.4-1.4L17.6 5z" />
      </svg>
    </button>
  </div>
</div>

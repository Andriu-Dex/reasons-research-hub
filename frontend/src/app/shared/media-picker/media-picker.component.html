<div class="media-picker">
  <label class="upload-tile">
    <span>{{ isUploading ? 'Subiendo...' : 'Subir imagen' }}</span>
    <input type="file" accept="image/jpeg,image/png,image/webp" (change)="upload($event)" [disabled]="isUploading" />
  </label>

  <button class="media-option empty" type="button" [class.selected]="!selectedId" (click)="select(null)">
    Sin imagen
  </button>

  @for (media of mediaFiles; track media.id) {
    <div class="media-wrapper">
      <button class="media-option" type="button" [class.selected]="media.id === selectedId" (click)="select(media.id)">
        <img [src]="media.url" [alt]="media.originalFilename" />
      </button>
      <button class="delete-btn" type="button" (click)="requestDelete(media.id)" title="Eliminar imagen">
        <span class="mat-icon sm">close</span>
      </button>
    </div>
  }
</div>

@if (itemToDelete) {
  <app-confirm-modal
    title="¿Eliminar esta imagen?"
    message="Esta acción no se puede deshacer. Se eliminará permanentemente de tu galería."
    confirmText="Eliminar"
    icon="warning"
    confirmIcon="delete_forever"
    [isDanger]="true"
    (confirm)="confirmDelete()"
    (cancel)="cancelDelete()"
  ></app-confirm-modal>
}

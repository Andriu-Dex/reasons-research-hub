<section>
  <div class="admin-view-header">
    <span class="eyebrow">Perfil</span>
    <h1>Cuenta administrativa</h1>
    <p>Actualiza tus datos de acceso y contrasena.</p>
  </div>
  @if (!profile) {
    <div class="state-card">Cargando perfil...</div>
  } @else {
    <div class="profile-grid">
      <form class="surface-card admin-form" (ngSubmit)="saveProfile()">
        <h2>Datos personales</h2>
        <div class="form-grid">
          <label>Nombre completo<input name="fullName" [(ngModel)]="profile.fullName" required /></label>
          <label>Correo<input name="email" type="email" [(ngModel)]="profile.email" required /></label>
          <label>Rol<input [value]="profile.role" disabled /></label>
          <label>Organizacion<input [value]="profile.organization?.name || 'Gestion global'" disabled /></label>
        </div>
        <button class="btn primary" type="submit" [disabled]="isSaving">Guardar perfil</button>
      </form>

      <form class="surface-card admin-form" (ngSubmit)="savePassword()">
        <h2>Contrasena</h2>
        <div class="form-grid single">
          <label>Contrasena actual<input name="currentPassword" type="password" [(ngModel)]="password.currentPassword" required /></label>
          <label>Nueva contrasena<input name="newPassword" type="password" [(ngModel)]="password.newPassword" required minlength="8" /></label>
        </div>
        <button class="btn primary" type="submit">Actualizar contrasena</button>
      </form>
    </div>
  }
</section>

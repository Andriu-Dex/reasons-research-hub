<section class="settings-page">
  <div class="admin-view-header">
    <span class="eyebrow">Configuración</span>
    <h1>Ajustes generales del sitio</h1>
    <p>Controla identidad institucional, colores, datos de contacto y logo.</p>
  </div>
  @if (isLoading) {
    <div class="skeleton-list">
      @for (i of [1,2,3]; track i) {
        <div class="skeleton skeleton-kpi"></div>
      }
    </div>
  } @else {
    <form class="surface-card admin-form" (ngSubmit)="save()">
      <h2 class="form-section-title"><span class="mat-icon">apartment</span> Identidad institucional</h2>
      <div class="form-grid">
        <label>Institución
          <input name="institutionName" [(ngModel)]="model.institutionName" required />
          <small class="field-hint">Nombre oficial de la institución.</small>
        </label>
        <label>Grupo
          <input name="groupName" [(ngModel)]="model.groupName" required />
          <small class="field-hint">Nombre del grupo de investigación.</small>
        </label>
        <label>Acrónimo
          <input name="acronym" [(ngModel)]="model.acronym" />
          <small class="field-hint">Siglas del grupo (ej. REASONS).</small>
        </label>
        <label>Correo institucional
          <input name="institutionalEmail" type="email" [(ngModel)]="model.institutionalEmail" />
        </label>
        <label class="full">Descripción
          <textarea name="generalDescription" rows="4" [(ngModel)]="model.generalDescription" required></textarea>
        </label>
        <label class="full">Misión
          <textarea name="mission" rows="3" [(ngModel)]="model.mission"></textarea>
        </label>
        <label class="full">Visión
          <textarea name="vision" rows="3" [(ngModel)]="model.vision"></textarea>
        </label>
        <label class="full">Dirección
          <textarea name="address" rows="2" [(ngModel)]="model.address"></textarea>
        </label>
      </div>

      <h2 class="form-section-title"><span class="mat-icon">palette</span> Personalización visual</h2>
      <div class="form-grid">
        <label>Color primario
          <input name="colorPrimary" type="color" [(ngModel)]="model.colorPrimary" />
        </label>
        <label>Color secundario
          <input name="colorSecondary" type="color" [(ngModel)]="model.colorSecondary" />
        </label>
        <label>Color fondo
          <input name="colorBackground" type="color" [(ngModel)]="model.colorBackground" />
        </label>
        <label>Color texto
          <input name="colorText" type="color" [(ngModel)]="model.colorText" />
        </label>
      </div>

      <h2 class="form-section-title"><span class="mat-icon">description</span> Contenido del pie de página</h2>
      <div class="form-grid">
        <label class="full">Texto de pie de página
          <textarea name="footerText" rows="2" [(ngModel)]="model.footerText"></textarea>
        </label>
        <label class="full">Logo
          <app-media-picker [(selectedId)]="model.logoMediaId"></app-media-picker>
        </label>
      </div>
      <button class="btn primary" type="submit" [disabled]="isSaving">
        <span class="icon-text"><span class="mat-icon sm">save</span> {{ isSaving ? 'Guardando...' : 'Guardar configuración' }}</span>
      </button>
    </form>
  }
</section>
